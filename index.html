<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroTrack - Controle Diário</title>
  <style>
    :root {
      --bg: #121214;
      --card: #202024;
      --text: #e1e1e6;
      --muted: #a8a8b3;
      --primary: #8257e5;
      --protein: #04d361;
      --carbs: #fba94c;
      --fat: #f75a68;
      --border: #323238;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 520px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-outline:hover { border-color: var(--text); color: var(--text); }

    .card { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
    .card h2 { font-size: 1rem; margin-bottom: 12px; color: var(--muted); }

    .macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .macro-box { background: var(--bg); padding: 12px; border-radius: 8px; }
    .macro-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; }
    .progress-bg { background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease; }

    form { display: grid; gap: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.95rem; }
    button.primary { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    button.primary:hover { filter: brightness(1.1); }

    .quick-list { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; }
    .chip:hover { border-color: var(--primary); }

    ul { list-style: none; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    li:last-child { border-bottom: none; }
    .item-macros { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .delete-btn { background: transparent; border: none; color: var(--fat); cursor: pointer; font-size: 1rem; padding: 4px 8px; }

    #goals-modal { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ MacroTrack</h1>
    <div>
      <button class="btn-outline" onclick="toggleGoals()">Metas</button>
      <button class="btn-outline" onclick="resetDay()">Zerar Dia</button>
    </div>
  </header>

  <!-- Configuração de Metas -->
  <div class="card" id="goals-modal">
    <h2>Definir Metas Diárias</h2>
    <div class="row" style="margin-bottom: 10px;">
      <input type="number" id="goal-p" placeholder="Proteína (g)">
      <input type="number" id="goal-c" placeholder="Carbo (g)">
      <input type="number" id="goal-f" placeholder="Gordura (g)">
    </div>
    <button class="primary" style="width: 100%;" onclick="saveGoals()">Salvar Metas</button>
  </div>

  <!-- Painel de Resumo -->
  <div class="card">
    <h2>Resumo de Hoje</h2>
    <div class="macro-grid">
      <div class="macro-box">
        <div class="macro-header"><span>🔥 Calorias</span><strong id="cal-text">0 / 2000</strong></div>
        <div class="progress-bg"><div class="progress-fill" id="cal-bar" style="background: var(--primary);"></div></div>
      </div>
      <div class="macro-box">
        <div class="macro-header"><span>🥩 Proteínas</span><strong id="p-text">0 / 150g</strong></div>
        <div class="progress-bg"><div class="progress-fill" id="p-bar" style="background: var(--protein);"></div></div>
      </div>
      <div class="macro-box">
        <div class="macro-header"><span>🍞 Carboidratos</span><strong id="c-text">0 / 200g</strong></div>
        <div class="progress-bg"><div class="progress-fill" id="c-bar" style="background: var(--carbs);"></div></div>
      </div>
      <div class="macro-box">
        <div class="macro-header"><span>🥑 Gorduras</span><strong id="f-text">0 / 65g</strong></div>
        <div class="progress-bg"><div class="progress-fill" id="f-bar" style="background: var(--fat);"></div></div>
      </div>
    </div>
  </div>

  <!-- Adicionar Alimento -->
  <div class="card">
    <h2>Adicionar Refeição / Alimento</h2>
    <div class="quick-list">
      <button class="chip" onclick="quickAdd('Dose de Whey', 24, 3, 1.5)">+ Whey (1 dose)</button>
      <button class="chip" onclick="quickAdd('Pão c/ Mussarela', 12, 26, 9)">+ Pão c/ Queijo</button>
      <button class="chip" onclick="quickAdd('2 Ovos', 12, 1, 10)">+ 2 Ovos</button>
      <button class="chip" onclick="quickAdd('Frango Grelhado (100g)', 31, 0, 3.6)">+ Frango (100g)</button>
    </div>
    <form onsubmit="addFood(event)">
      <input type="text" id="food-name" placeholder="Nome do alimento (ex: Café da manhã)" required>
      <div class="row">
        <input type="number" step="0.1" id="food-p" placeholder="Prot (g)" required>
        <input type="number" step="0.1" id="food-c" placeholder="Carb (g)" required>
        <input type="number" step="0.1" id="food-f" placeholder="Gord (g)" required>
      </div>
      <button type="submit" class="primary">Adicionar ao Dia</button>
    </form>
  </div>

  <!-- Lista do Dia -->
  <div class="card">
    <h2>Consumo Registrado</h2>
    <ul id="food-list"></ul>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem('macro_items')) || [];
    let goals = JSON.parse(localStorage.getItem('macro_goals')) || { p: 150, c: 200, f: 65 };

    function calcCalories(p, c, f) {
      return Math.round((p * 4) + (c * 4) + (f * 9));
    }

    function render() {
      const list = document.getElementById('food-list');
      list.innerHTML = '';

      let totalP = 0, totalC = 0, totalF = 0;

      items.forEach((item, index) => {
        totalP += item.p;
        totalC += item.c;
        totalF += item.f;
        const cal = calcCalories(item.p, item.c, item.f);

        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <strong>${item.name}</strong>
            <div class="item-macros">${cal} kcal • P: ${item.p}g | C: ${item.c}g | G: ${item.f}g</div>
          </div>
          <button class="delete-btn" onclick="removeFood(${index})">✕</button>
        `;
        list.appendChild(li);
      });

      if (items.length === 0) {
        list.innerHTML = '<li style="color: var(--muted);">Nenhum alimento adicionado hoje.</li>';
      }

      const totalCal = calcCalories(totalP, totalC, totalF);
      const goalCal = calcCalories(goals.p, goals.c, goals.f);

      updateBar('cal', totalCal, goalCal, '');
      updateBar('p', Math.round(totalP), goals.p, 'g');
      updateBar('c', Math.round(totalC), goals.c, 'g');
      updateBar('f', Math.round(totalF), goals.f, 'g');
    }

    function updateBar(id, current, max, unit) {
      document.getElementById(`${id}-text`).innerText = `${current} / ${max}${unit}`;
      const pct = Math.min((current / max) * 100, 100);
      document.getElementById(`${id}-bar`).style.width = `${pct}%`;
    }

    function addFood(e) {
      e.preventDefault();
      const name = document.getElementById('food-name').value;
      const p = parseFloat(document.getElementById('food-p').value) || 0;
      const c = parseFloat(document.getElementById('food-c').value) || 0;
      const f = parseFloat(document.getElementById('food-f').value) || 0;

      items.push({ name, p, c, f });
      saveAndRender();
      e.target.reset();
    }

    function quickAdd(name, p, c, f) {
      items.push({ name, p, c, f });
      saveAndRender();
    }

    function removeFood(index) {
      items.splice(index, 1);
      saveAndRender();
    }

    function resetDay() {
      if (confirm('Deseja zerar os registros de hoje?')) {
        items = [];
        saveAndRender();
      }
    }

    function toggleGoals() {
      const modal = document.getElementById('goals-modal');
      document.getElementById('goal-p').value = goals.p;
      document.getElementById('goal-c').value = goals.c;
      document.getElementById('goal-f').value = goals.f;
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function saveGoals() {
      goals.p = parseFloat(document.getElementById('goal-p').value) || 150;
      goals.c = parseFloat(document.getElementById('goal-c').value) || 200;
      goals.f = parseFloat(document.getElementById('goal-f').value) || 65;
      localStorage.setItem('macro_goals', JSON.stringify(goals));
      document.getElementById('goals-modal').style.display = 'none';
      render();
    }

    function saveAndRender() {
      localStorage.setItem('macro_items', JSON.stringify(items));
      render();
    }

    render();
  </script>
</body>
</html>
